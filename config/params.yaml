    avg_unit_price:
      min: 0.13
      max: 295.0
    n_unique_products:
      min: 1.0
      max: 1295.0
    n_active_months:
      min: 1.0
      max: 10.0
    n_active_weeks:
      min: 1.0
      max: 36.0
    tenure_days_in_window:
      min: 0.17
      max: 269.64
    mean_interpurchase_days:
      min: 0.00069
      max: 255.05
    spend_last_30d:
      min: 0.0
      max: 18534.44
    spend_last_60d:
      min: 0.0
      max: 99125.7
    spend_last_90d:
      min: 0.0
      max: 103579.5
    invoices_last_30d:
      min: 0.0
