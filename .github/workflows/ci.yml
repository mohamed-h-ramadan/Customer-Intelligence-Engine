name: CI

on:
  push:
    branches: [main, feat/production-engine]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Lint with Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Verify Documentation Metrics Parity
        run: |
          python scripts/render_metrics.py --check

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -rs

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  docker-smoke:
    name: Build & Smoke Test Container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local container image
        run: |
          docker build -t cie-api:test -f docker/Dockerfile .

      - name: Run container
        run: |
          docker run -d --name cie-app -p 8000:8000 -e CIE_PORT=8000 cie-api:test
          sleep 5

      - name: Set up Python for Smoke Test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install client dependencies
        run: |
          pip install httpx pandas pyarrow

      - name: Execute Smoke Test
        run: |
          python scripts/smoke_test.py --url http://localhost:8000

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs cie-app

  publish:
    name: Publish to GHCR
    needs: [test, docker-smoke]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
