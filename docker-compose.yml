# ==============================================================================
# Customer Intelligence Engine (CIE) - Multi-Container Service Compose
# ==============================================================================

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cie-api
    ports:
      - "8000:8000"
    environment:
      - CIE_PORT=8000
      - CIE_HOST=0.0.0.0
      - CIE_MAX_BATCH_SIZE=1000
    restart: unless-stopped

  mlflow:
    image: python:3.12-slim
    container_name: cie-mlflow
    command: >
      sh -c "pip install --no-cache-dir mlflow &&
             mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - ./mlartifacts:/mlflow/artifacts
      - ./mlflow.db:/mlflow/mlflow.db
    restart: unless-stopped
